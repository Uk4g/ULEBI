<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="metaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FB7185"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="46" fill="#F8FAFC" font-size="22" font-weight="800" letter-spacing="0.02em">ULEBI × META AI — 4-MODEL CLINICAL TRIAGE &amp; DISPATCH PIPELINE</text>
  <text x="40" y="70" fill="#94A3B8" font-size="13">Real-time multi-modal orchestration across Infrared Vision, Bedside Audio, and Patient Room Hardware Buttons</text>
  <line x1="40" y1="86" x2="1160" y2="86" stroke="#1E293B" stroke-width="1.5"/>

  <!-- COLUMN 1: HOSPITAL ROOM SENSORS -->
  <text x="40" y="116" fill="#2DD4BF" font-size="11" font-weight="700" letter-spacing="0.12em">STAGE 1 · PATIENT ROOM HARDWARE</text>

  <!-- IR Camera Box -->
  <rect x="40" y="132" width="270" height="150" rx="12" fill="#111827" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="58" y="160" fill="#F8FAFC" font-size="15" font-weight="700">1. Room IR Night Camera</text>
  <text x="58" y="182" fill="#94A3B8" font-size="11.5">• 850nm / 940nm pitch-black IR LEDs</text>
  <text x="58" y="202" fill="#94A3B8" font-size="11.5">• 1080p RTSP / HLS / MP4 video stream</text>
  <text x="58" y="222" fill="#94A3B8" font-size="11.5">• Rolling 3.5s MP4 slices &amp; Frame-0 snaps</text>
  <rect x="58" y="240" width="234" height="26" rx="6" fill="#0D9488" fill-opacity="0.2" stroke="#2DD4BF" stroke-width="1"/>
  <text x="70" y="257" fill="#2DD4BF" font-size="10.5" font-weight="600">Calibrated Bed Zone + Multi-Target</text>

  <!-- Built-in Mic Box -->
  <rect x="40" y="302" width="270" height="145" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="58" y="330" fill="#F8FAFC" font-size="15" font-weight="700">2. IR Camera Voice Mic</text>
  <text x="58" y="352" fill="#94A3B8" font-size="11.5">• Built-in omnidirectional room mic</text>
  <text x="58" y="372" fill="#94A3B8" font-size="11.5">• Energy VAD SpeechSegmenter (pre-roll)</text>
  <text x="58" y="392" fill="#94A3B8" font-size="11.5">• Resampled 16 kHz Mono PCM16 WAV</text>
  <rect x="58" y="408" width="234" height="24" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="70" y="424" fill="#38BDF8" font-size="10.5" font-weight="600">EN / FR / Algerian Arabic (Dziriya)</text>

  <!-- Bedside Pad Box -->
  <rect x="40" y="467" width="270" height="175" rx="12" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="58" y="495" fill="#F8FAFC" font-size="15" font-weight="700">3. Patient Bedside Tablet</text>
  <text x="58" y="516" fill="#94A3B8" font-size="11.5">• Direct hardware buttons in room:</text>
  <rect x="58" y="528" width="112" height="24" rx="5" fill="#E11D48" fill-opacity="0.25" stroke="#FB7185"/>
  <text x="68" y="544" fill="#FDA4AF" font-size="10" font-weight="700">EMERGENCY HELP</text>
  <rect x="178" y="528" width="114" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="190" y="544" fill="#E2E8F0" font-size="10" font-weight="600">BATHROOM (WC)</text>
  <rect x="58" y="558" width="112" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="68" y="574" fill="#E2E8F0" font-size="10" font-weight="600">PAIN / COMFORT</text>
  <rect x="178" y="558" width="114" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="190" y="574" fill="#E2E8F0" font-size="10" font-weight="600">EAT / MEAL</text>
  <rect x="58" y="588" width="112" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="68" y="604" fill="#E2E8F0" font-size="10" font-weight="600">WATER</text>
  <rect x="178" y="588" width="114" height="24" rx="5" fill="#1E293B" stroke="#475569"/>
  <text x="190" y="604" fill="#E2E8F0" font-size="10" font-weight="600">DRINK / JUICE</text>

  <!-- COLUMN 2: META AI PERCEPTION & REASONING MODELS -->
  <text x="365" y="116" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="0.12em">STAGE 2 · META MODEL API PIPELINE (api.meta.ai/v1)</text>

  <!-- SAM 3.1 -->
  <rect x="365" y="132" width="265" height="150" rx="12" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
  <text x="383" y="158" fill="#2DD4BF" font-size="16" font-weight="800">Meta SAM 3.1 (sam-3.1)</text>
  <text x="383" y="176" fill="#64748B" font-size="10.5">POST /v1/files + POST /v1/responses (SSE)</text>
  <text x="383" y="198" fill="#E2E8F0" font-size="11.5">• Tracks multiple targets simultaneously</text>
  <text x="383" y="216" fill="#E2E8F0" font-size="11.5">• 3 Modes: Text, Spatial &lt;0f&gt;, Exemplar</text>
  <text x="383" y="234" fill="#E2E8F0" font-size="11.5">• Outputs &lt;|box;x1..y2|&gt; + Bed Overlap %</text>
  <text x="383" y="252" fill="#2DD4BF" font-size="11" font-weight="600">• Preserves ORIGIN_LOCKED_PATIENT</text>

  <!-- Muse Wonder 1.0 -->
  <rect x="365" y="302" width="265" height="135" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
  <text x="383" y="328" fill="#A78BFA" font-size="16" font-weight="800">Muse Wonder 1.0</text>
  <text x="383" y="346" fill="#64748B" font-size="10.5">POST /v1/responses (Gated Video Assessor)</text>
  <text x="383" y="368" fill="#E2E8F0" font-size="11.5">• Triggered when SAM flags bed exit / unseen</text>
  <text x="383" y="386" fill="#E2E8F0" font-size="11.5">• Reads 3.5s MP4 file_id + SAM track JSON</text>
  <text x="383" y="404" fill="#A78BFA" font-size="11" font-weight="600">• Verifies posture (on_floor / standing / staff)</text>

  <!-- Muse Voice Transcribe 1.0 -->
  <rect x="365" y="457" width="265" height="125" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <text x="383" y="483" fill="#38BDF8" font-size="15.5" font-weight="800">Muse Voice Transcribe 1.0</text>
  <text x="383" y="501" fill="#64748B" font-size="10.5">POST /v1/asr/transcribe (PUSH_TO_TALK)</text>
  <text x="383" y="523" fill="#E2E8F0" font-size="11.5">• Transcribes 16 kHz PCM16 room audio</text>
  <text x="383" y="541" fill="#E2E8F0" font-size="11.5">• Distress keyword bias (EN / FR / AR)</text>
  <text x="383" y="559" fill="#38BDF8" font-size="11" font-weight="600">• Passes verbatim speech to Spark 1.3</text>

  <!-- Safety Floor Bar -->
  <rect x="365" y="598" width="265" height="44" rx="10" fill="#1E1B4B" stroke="#FB7185" stroke-width="1.5"/>
  <text x="383" y="618" fill="#FDA4AF" font-size="11.5" font-weight="700">Deterministic Safety Floor (RULES)</text>
  <text x="383" y="633" fill="#94A3B8" font-size="10">AI can elevate urgency, never downgrade a RED</text>

  <!-- COLUMN 3: MUSE SPARK 1.3 CENTRAL BRAIN -->
  <rect x="685" y="185" width="225" height="390" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="703" y="218" fill="#F59E0B" font-size="17" font-weight="800">Muse Spark 1.3</text>
  <text x="703" y="236" fill="#94A3B8" font-size="10.5">POST /v1/chat/completions</text>
  <text x="703" y="256" fill="#F8FAFC" font-size="12" font-weight="700">Charge-Nurse Reasoning Brain</text>
  <line x1="703" y1="268" x2="892" y2="268" stroke="#334155"/>
  <text x="703" y="290" fill="#CBD5E1" font-size="11">Fuses simultaneously:</text>
  <text x="703" y="312" fill="#2DD4BF" font-size="11">1. SAM 3.1 spatial tracks</text>
  <text x="703" y="332" fill="#A78BFA" font-size="11">2. Wonder 1.0 posture JSON</text>
  <text x="703" y="352" fill="#38BDF8" font-size="11">3. Voice 1.0 speech transcript</text>
  <text x="703" y="372" fill="#F59E0B" font-size="11">4. Pad Button (EAT/WC/HELP)</text>
  <text x="703" y="392" fill="#FDA4AF" font-size="11">5. Room EHR Risk Context</text>
  <text x="715" y="408" fill="#94A3B8" font-size="10">(Fall Risk, Post-Op, Strict NPO)</text>
  <line x1="703" y1="422" x2="892" y2="422" stroke="#334155"/>
  <text x="703" y="444" fill="#F8FAFC" font-size="11.5" font-weight="700">Strict JSON Output:</text>
  <text x="703" y="464" fill="#FB7185" font-size="11" font-weight="700">• RED (Critical Emergency)</text>
  <text x="703" y="482" fill="#FBBF24" font-size="11" font-weight="700">• YELLOW (Caution / Assist)</text>
  <text x="703" y="500" fill="#34D399" font-size="11" font-weight="700">• routine (Stable Log)</text>
  <text x="703" y="524" fill="#94A3B8" font-size="10.5">+ Exemplar Crop Noun Phrase</text>
  <text x="703" y="542" fill="#94A3B8" font-size="10.5">+ Shift Directive &amp; Handoff</text>

  <!-- COLUMN 4: DISPATCH & WORKSTATION OUTPUT -->
  <text x="955" y="116" fill="#34D399" font-size="11" font-weight="700" letter-spacing="0.12em">STAGE 3 · CLINICAL ACTION</text>

  <rect x="955" y="145" width="210" height="150" rx="12" fill="#111827" stroke="#FB7185" stroke-width="2"/>
  <text x="973" y="173" fill="#FDA4AF" font-size="14.5" font-weight="800">Proximity Nurse Call</text>
  <text x="973" y="195" fill="#E2E8F0" font-size="11">• Calls closest on-duty nurse</text>
  <text x="973" y="213" fill="#E2E8F0" font-size="11">• Live 15s–120s step timer</text>
  <text x="973" y="231" fill="#E2E8F0" font-size="11">• Auto-escalates to Nurse #2</text>
  <text x="973" y="249" fill="#E2E8F0" font-size="11">• Sends "On the way" to Pad</text>

  <rect x="955" y="315" width="210" height="145" rx="12" fill="#111827" stroke="#34D399" stroke-width="2"/>
  <text x="973" y="343" fill="#34D399" font-size="14.5" font-weight="800">10-to-1 Nurse Station</text>
  <text x="973" y="365" fill="#E2E8F0" font-size="11">• 1 Charge Nurse runs ward</text>
  <text x="973" y="383" fill="#E2E8F0" font-size="11">• Ranked Priority Triage Board</text>
  <text x="973" y="401" fill="#E2E8F0" font-size="11">• 1-Sec Scrubbable Timeline</text>
  <text x="973" y="419" fill="#E2E8F0" font-size="11">• Prevents nurse heart attacks</text>

  <rect x="955" y="480" width="210" height="140" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="973" y="508" fill="#38BDF8" font-size="14.5" font-weight="800">Morning Handoff</text>
  <text x="973" y="530" fill="#E2E8F0" font-size="11">• Auto-written shift summary</text>
  <text x="973" y="548" fill="#E2E8F0" font-size="11">• Real token &amp; cost ledger</text>
  <text x="973" y="566" fill="#E2E8F0" font-size="11">• Zero paper charting lost</text>

  <!-- ARROWS -->
  <line x1="310" y1="205" x2="360" y2="205" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <line x1="497" y1="282" x2="497" y2="298" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <line x1="310" y1="375" x2="360" y2="510" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="630" y1="205" x2="680" y2="280" stroke="#2DD4BF" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <line x1="630" y1="368" x2="680" y2="350" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="630" y1="518" x2="680" y2="430" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="310" y1="555" x2="680" y2="490" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <line x1="910" y1="290" x2="950" y2="225" stroke="#FB7185" stroke-width="2.5" marker-end="url(#arrowRose)"/>
  <line x1="910" y1="380" x2="950" y2="380" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <line x1="910" y1="470" x2="950" y2="535" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
</svg>