    function renderPipelineChipDrawer(modelKey) {
      const meta = MODEL_META.find((m) => m.key === modelKey);
      const logs = state.apiLogs.filter((l) => classifyModelKey(l.model) === modelKey).slice(0, 6);
      const hasKey = Boolean(activeKeyFor(modelKey));
      return `
        <div class="mt-3 rounded-xl border border-line bg-well p-3.5 text-xs space-y-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-line pb-2">

              <span class="ml-2 rounded border border-line-strong bg-panel px-1.5 py-0.5 font-mono text-[10px] ${hasKey ? 'text-emerald-400' : 'text-mut'}">${hasKey ? 'Key Configured' : 'Key Unset'}</span>
            </div>

              <button type="button" data-action="test-pipeline-model" data-model="${modelKey}" class="btn-base btn-primary">Test ${escHtml(meta.label)} Connection</button>

              <button type="button" data-action="select-pipeline-chip" data-model="${modelKey}" class="btn-base btn-ghost">Close</button>

          </div>

          <div class="rounded-lg border border-line bg-panel p-2.5 font-mono text-[11px] space-y-1 text-sec">
            <div class="text-[10px] uppercase tracking-wider text-mut">Chained Meta Workflow &amp; Real Prompt Contract</div>
            <div><strong class="text-pri">Upstream Input:</strong> ${escHtml(meta.inputContract)}</div>
            <div><strong class="text-pri">Downstream Handoff:</strong> ${escHtml(meta.outputContract)}</div>
            <div class="pt-1 text-[10px] text-mut break-words"><strong class="text-pri">Real Prompt / Payload:</strong> ${escHtml(meta.systemPrompt)}</div>
          </div>

          <div class="space-y-1 font-mono text-[11px]">
            ${logs.length === 0 ? `<div class="text-mut py-1">No live calls recorded for ${escHtml(meta.label)} yet. Click "Test ${escHtml(meta.label)} Connection" above to probe the endpoint.</div>` : logs.map((l) => `
              <div class="flex justify-between py-0.5 text-sec">
                <span>${clockTime(l.time)} · ${escHtml(l.endpoint)} · ${escHtml(l.note || '')}</span>

              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderUsageView() {
      const u = computeUsage();
      const isAdmin = effectiveRole() === 'admin';
      const metric = state.chartMetric;

      const rawVals = u.series.map((p) =>
        metric === 'spend'
          ? Math.max(p.currentUsd || 0, p.previousUsd || 0, p.averageUsd || 0)
          : metric === 'tokens'
            ? p.tokens || 0
            : p.requests || 0
      );
      const peakVal = Math.max(...rawVals, 0);
      const maxVal = peakVal > 0 ? peakVal * 1.25 : (metric === 'spend' ? 0.10 : metric === 'tokens' ? 1000 : 10);

      const fmtY = (v) => {
        if (metric === 'spend') return v < 1 ? '$' + v.toFixed(3) : '$' + v.toFixed(1);
        return Math.round(v).toLocaleString();
      };

      return `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="font-mono text-[10px] uppercase tracking-[0.14em] text-mut">REAL-TIME MODEL TELEMETRY</div>
              <h2 class="mt-0.5 font-serif-editorial text-4xl font-normal tracking-tight text-pri">Usage &amp; Costs</h2>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" data-action="open-modal" data-modal="customizeChart" class="btn-base btn-secondary">${IC.sliders} <span>Customize (${metric})</span></button>
              ${isAdmin ? `<button type="button" data-action="open-modal" data-modal="budget" class="btn-base btn-secondary">Budget Limit ($${u.budgetLimitUsd})</button>` : ''}
              <div class="flex rounded-lg border border-line bg-panel p-0.5 text-xs">
                ${[
                  ['24h', '24h'],
                  ['7d', '7 days'],
                  ['3m', '3 months']
                ].map(([k, lbl]) => `
                  <button type="button" data-action="set-usage-range" data-range="${k}" class="rounded-md px-2.5 py-1 font-medium transition ${state.usageRange === k ? 'bg-raised text-pri' : 'text-sec hover:text-pri'}">
                    ${lbl}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>

          <section class="card-12 p-6">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="text-xs text-sec">${metric === 'spend' ? 'Spend' : metric === 'tokens' ? 'Total Tokens' : 'API Requests'}</div>

    function renderCalendarView() {
      const u = computeUsage();
      const baseDate = new Date(nowMs);
      baseDate.setMonth(baseDate.getMonth() + state.calendarMonthOffset);
      const monthLabel = baseDate.toLocaleDateString([], { month: 'short', year: 'numeric' });

      const filteredEvents = state.events.filter((e) => {
        if (state.calRoomFilter !== 'ALL' && e.room !== state.calRoomFilter) return false;
        if (state.calUrgencyFilter !== 'ALL' && e.level !== state.calUrgencyFilter) return false;
        if (state.calSearch.trim()) {
          const q = state.calSearch.toLowerCase();
          if (!(e.roomName || '').toLowerCase().includes(q) && !(e.headline || '').toLowerCase().includes(q)) return false;
        }
        return true;
      });

      const firstDay = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
      const startOffset = firstDay.getDay();
      const start = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1 - startOffset);
      const totalCells = state.calendarViewMode === 'week' ? 7 : 42;

      const dayEventsUpToSec = state.events.filter((e) => {
        if (e.createdAt.slice(0, 10) !== state.selectedDayKey) return false;
        const d = new Date(e.createdAt);
        const s = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
        return s <= state.scrubberSec;
      });
      const dayLogsUpToSec = state.apiLogs.filter((l) => {
        if (l.time.slice(0, 10) !== state.selectedDayKey) return false;
        const d = new Date(l.time);
        const s = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
        return s <= state.scrubberSec;
      });

      return `
        <div class="space-y-5">
          <section class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <div class="font-serif-editorial text-4xl font-normal tracking-tight text-pri">
                ${u.totalCallsMonth.toLocaleString()} AI calls
              </div>
              <div class="mt-0.5 text-xs text-sec">
                ${u.totalTokensMonth.toLocaleString()} tokens · $${u.totalCostMonthUsd.toFixed(4)} this month
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <div class="flex min-h-[32px] items-center gap-2 rounded-lg border border-line bg-panel px-2.5 text-xs">
                <button type="button" data-action="cal-nav" data-dir="-1" class="px-1 text-sec hover:text-pri" aria-label="Previous month">‹</button>
                <span class="min-w-[70px] text-center font-medium text-pri">${monthLabel}</span>
                <button type="button" data-action="cal-nav" data-dir="1" class="px-1 text-sec hover:text-pri" aria-label="Next month">›</button>
              </div>
              <button type="button" data-action="cal-today" class="btn-base btn-secondary">Today</button>
              <div class="flex rounded-lg border border-line bg-panel p-0.5 text-xs">
                <button type="button" data-action="cal-mode" data-mode="week" class="rounded-md px-3 py-1 font-medium ${state.calendarViewMode === 'week' ? 'bg-raised text-pri' : 'text-sec'}">Week</button>
                <button type="button" data-action="cal-mode" data-mode="month" class="rounded-md px-3 py-1 font-medium ${state.calendarViewMode === 'month' ? 'bg-raised text-pri' : 'text-sec'}">Month</button>
              </div>
            </div>
          </section>

          <section class="overflow-hidden border border-line bg-ink rounded-[12px]">
            <div class="grid grid-cols-7 border-b border-line bg-panel text-left font-mono text-[10px] uppercase tracking-wider text-mut">
              <div class="px-3 py-2.5">SUN</div><div class="px-3 py-2.5">MON</div><div class="px-3 py-2.5">TUE</div><div class="px-3 py-2.5">WED</div><div class="px-3 py-2.5">THU</div><div class="px-3 py-2.5">FRI</div><div class="px-3 py-2.5">SAT</div>
            </div>
            <div class="grid grid-cols-7 divide-x divide-y divide-line">
              ${Array.from({ length: totalCells }, (_, i) => {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                const key = d.toISOString().slice(0, 10);
                const inMonth = d.getMonth() === baseDate.getMonth();
                const cellEvs = filteredEvents.filter((e) => e.createdAt.slice(0, 10) === key);
                const cellLogs = state.apiLogs.filter((l) => l.time.slice(0, 10) === key);
                const hasRed = cellEvs.some((e) => e.level === 'RED');
                const selected = state.selectedDayKey === key;
                return `
                  <button type="button" data-action="select-cal-day" data-day="${key}" class="flex min-h-[96px] flex-col justify-between p-2.5 text-left transition ${!inMonth ? 'cal-hatched text-mut' : 'bg-ink text-pri hover:bg-panel'} ${selected ? 'bg-raised ring-1 ring-inset ring-zinc-400' : ''}">
                    <div class="flex w-full items-start justify-between">
                      <span class="text-xs font-medium ${!inMonth ? 'text-mut' : 'text-pri'}">${d.getDate()}</span>
                      <div class="flex items-center gap-1">
                        ${cellLogs.length > 0 ? `<span class="font-mono text-[9px] text-sec">${cellLogs.length} req</span>` : ''}
                        ${hasRed ? `<span class="h-1.5 w-1.5 rounded-full bg-rose-500"></span>` : ''}
                      </div>
                    </div>
                    <div class="mt-1.5 w-full space-y-1">
                      ${cellEvs.slice(0, 2).map((ev) => `
                        <div class="truncate rounded bg-raised px-2 py-0.5 text-[10px] text-sec border border-line">
                          ${escHtml(ev.roomName)} · ${escHtml(ev.headline)}
                        </div>
                      `).join('')}
                      ${cellEvs.length > 2 ? `<div class="px-1 text-[10px] font-medium text-sec">+${cellEvs.length - 2} more</div>` : ''}
                    </div>
                  </button>

              }).join('')}
            </div>
          </section>

          <div class="flex flex-wrap items-center justify-between gap-3">

            <div class="flex items-center gap-2">

            </div>
          </div>

          <section class="card-12 p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <span class="font-mono text-xs text-sec">Scrub timeline (1-second resolution): <strong class="text-pri">${formatSecOfDay(state.scrubberSec)}</strong></span>
              <div class="flex items-center gap-2">
                <button type="button" data-action="toggle-timeline-play" class="btn-base ${state.timelinePlaying ? 'btn-danger' : 'btn-primary'}">
                  ${state.timelinePlaying ? 'Pause' : 'Play'}
                </button>
                <select id="timeline-speed-select" aria-label="Playback speed" class="input-std w-auto font-mono text-xs">
                  <option value="1" ${state.timelineSpeed === 1 ? 'selected' : ''}>1x</option>
                  <option value="2" ${state.timelineSpeed === 2 ? 'selected' : ''}>2x</option>
                  <option value="5" ${state.timelineSpeed === 5 ? 'selected' : ''}>5x</option>
                  <option value="10" ${state.timelineSpeed === 10 ? 'selected' : ''}>10x</option>
                </select>
              </div>
            </div>
            <input id="timeline-scrubber" type="range" min="0" max="86399" step="1" value="${state.scrubberSec}" aria-label="1-second timeline scrubber" class="w-full cursor-pointer" />

            <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
              <div class="rounded-lg border border-line bg-well p-3">
                <div class="font-mono text-[10px] uppercase text-mut">Events up to ${formatSecOfDay(state.scrubberSec)}</div>
                <div class="mt-1 font-mono text-lg font-semibold text-pri">${dayEventsUpToSec.length}</div>
                <div class="mt-0.5 text-[11px] text-sec truncate">${dayEventsUpToSec[0] ? `${dayEventsUpToSec[0].roomName}: ${dayEventsUpToSec[0].headline}` : 'No room events before this second'}</div>
              </div>
              <div class="rounded-lg border border-line bg-well p-3">
                <div class="font-mono text-[10px] uppercase text-mut">Model Calls up to ${formatSecOfDay(state.scrubberSec)}</div>
                <div class="mt-1 font-mono text-lg font-semibold text-pri">${dayLogsUpToSec.length}</div>
                <div class="mt-0.5 text-[11px] text-sec truncate">${dayLogsUpToSec[0] ? `${dayLogsUpToSec[0].model} (${dayLogsUpToSec[0].latencyMs}ms)` : 'No API calls before this second'}</div>
              </div>
              <div class="rounded-lg border border-line bg-well p-3">
                <div class="font-mono text-[10px] uppercase text-mut">Tokens Used up to ${formatSecOfDay(state.scrubberSec)}</div>
                <div class="mt-1 font-mono text-lg font-semibold text-pri">${dayLogsUpToSec.reduce((s, l) => s + (l.totalTokens || 0), 0).toLocaleString()}</div>
                <div class="mt-0.5 text-[11px] text-sec">${state.rooms.length} room(s) · ${state.nurses.filter(n => n.onDuty !== false).length} nurse(s) on duty</div>
              </div>
            </div>

            <div class="space-y-2 rounded-xl border border-line bg-well p-3.5">
              <div class="font-mono text-[10px] uppercase text-mut">Model Swim Lanes (Click any tick to jump to that exact second)</div>
              ${MODEL_META.map((m) => {
                const calls = state.apiLogs.filter((l) => classifyModelKey(l.model) === m.key && l.time.slice(0, 10) === state.selectedDayKey);
                return `
                  <div class="flex items-center gap-3">
                    <div class="w-40 shrink-0 font-mono text-[11px] text-sec">${m.label}</div>
                    <div class="relative h-6 flex-1 rounded border border-line bg-panel">
                      <div class="pointer-events-none absolute inset-y-0 w-px bg-current" style="left: ${(state.scrubberSec / 86399) * 100}%"></div>
                      ${calls.map((c) => {
                        const d = new Date(c.time);
                        const sec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
                        return `<button type="button" data-action="scrub-to-sec" data-sec="${sec}" title="${m.label} · ${clockTime(c.time)} · ${c.latencyMs}ms · ${c.totalTokens} tok" style="left: ${(sec / 86399) * 100}%" class="absolute top-1 h-4 w-1.5 -translate-x-1/2 rounded-sm bg-current opacity-85 hover:opacity-100"></button>`;

                    </div>
                    <span class="w-10 text-right font-mono text-[10px] text-mut">${calls.length}</span>

            </div>
          </section>
        </div>
      `;

      // 2. BEDSIDE VOICE (MUSE VOICE 1.0 -> MUSE SPARK 1.3)

            <section class="card-12 p-5 xl:col-span-5 space-y-4">

              ${latestVoice ? `

        { id: 'BATHROOM ASSIST', label: 'Bathroom Assist', sub: 'I need help getting up to the bathroom', defaultRole: 'Evaluated by Spark 1.3 → pages on-duty nurse', crit: false },
        { id: 'PAIN / COMFORT', label: 'Pain / Comfort', sub: 'Pain, position adjustment, or blanket', defaultRole: 'Evaluated by Spark 1.3 → pages on-duty nurse', crit: false },
        { id: 'WATER', label: 'Water', sub: 'Please bring a glass of water', defaultRole: 'Evaluated by Spark 1.3 (checks NPO risk)', crit: false },
        { id: 'DRINK', label: 'Drink', sub: 'Please bring juice or tea', defaultRole: 'Evaluated by Spark 1.3 (checks NPO risk)', crit: false },

      const roomTaskEvents = state.events.filter((e) => e.room === rm.id && e.source === 'TASK').slice(0, 6);

      return `
        ${tabs}
        <div class="grid grid-cols-1 gap-5 xl:grid-cols-12">
          <section class="card-12 p-5 xl:col-span-7 space-y-4">

                <div class="mt-1 text-sec">Told nurse: <strong>"${escHtml(activeRoomEsc.headline)}"</strong> — ${escHtml(activeRoomEsc.nurseAction)}</div>
              </div>
            ` : lastAckEsc ? `
              <div class="rounded-xl border border-emerald-500/50 bg-emerald-500/12 p-4 text-xs">
                <div class="font-semibold text-emerald-300">Nurse is on the way to ${escHtml(rm.name)}</div>
                <div class="mt-0.5 text-sec">Acknowledged request: "${escHtml(lastAckEsc.headline)}"</div>
              </div>
            ` : `
              <div class="rounded-xl border border-line bg-well px-4 py-3 text-xs text-sec flex items-center justify-between">
                <span>Connected to Nurse Station · On-duty nurses ready: <strong>${state.nurses.filter(n => n.onDuty !== false).length}</strong></span>
                <span class="font-mono text-[10px] text-emerald-400">ONLINE</span>
              </div>
            `}

            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
              ${padButtons.map((b) => `
                <button type="button" data-action="press-pad-btn" data-task="${b.id}" class="card-interactive flex min-h-[112px] flex-col justify-between rounded-xl border p-4 text-left ${b.crit ? 'border-rose-500/60 bg-rose-500/10 text-pri' : 'border-line bg-raised text-pri'}" ${state.padBusy ? 'disabled' : ''}>
                  <div class="flex items-center justify-between w-full">
                    <span class="font-mono text-[10px] uppercase ${b.crit ? 'text-rose-400 font-semibold' : 'text-sky-400'}">${b.crit ? 'IMMEDIATE RED PAGE' : 'SPARK 1.3 TRIAGE'}</span>
                  </div>
                  <div class="mt-2">
                    <div class="text-base font-semibold text-pri">${b.label}</div>
                    <div class="mt-0.5 text-xs text-sec">${b.sub}</div>
                    <div class="mt-1.5 font-mono text-[10px] text-mut">${b.defaultRole}</div>
                  </div>
                </button>
              `).join('')}
            </div>

            <div>
              <label for="pad-note-input" class="block text-xs font-medium text-sec mb-1">Optional message for the nurse</label>
              <input id="pad-note-input" type="text" class="input-std" placeholder="Add an optional note for your nurse…" value="${escHtml(state.padNote)}" />
            </div>
          </section>

          <section class="card-12 p-5 xl:col-span-5 space-y-4">
            <div>
              <div class="font-mono text-[10px] uppercase tracking-wider text-mut">NURSE &amp; ADMIN CONNECTION</div>
              <h3 class="text-sm font-semibold text-pri">Live Nurse Dispatch for ${escHtml(rm.name)}</h3>
              <p class="text-[11px] text-sec">When the patient presses any button on the left, ULEBI dispatches the on-duty nurse below.</p>
            </div>

            ${activeRoomEsc ? `
              <div class="rounded-xl border border-line-strong bg-well p-4 space-y-3 text-xs">
                <div class="flex items-center justify-between">

                <div>
                  <div class="font-semibold text-pri">${escHtml(activeRoomEsc.headline)}</div>
                  <div class="mt-1 text-sec">${escHtml(activeRoomEsc.nurseAction)}</div>
                </div>
                <div class="flex gap-2 pt-1">
                  <button type="button" data-action="ack-call" data-esc="${activeRoomEsc.id}" class="btn-base btn-primary flex-1">Acknowledge &amp; Notify Patient</button>
                  <button type="button" data-action="next-call" data-esc="${activeRoomEsc.id}" class="btn-base btn-secondary">Page Next Nurse</button>
                </div>
              </div>
            ` : `
              <div class="rounded-xl border border-line bg-well p-5 text-center text-xs text-mut">
                No active call for ${escHtml(rm.name)} right now. Press any patient button on the left to auto-call an on-duty nurse.
              </div>
            `}

            <div class="space-y-2">
              <div class="font-mono text-[10px] uppercase tracking-wider text-mut">Recent Patient Pad Requests (${escHtml(rm.name)})</div>
              ${roomTaskEvents.length === 0 ? `<div class="text-xs text-mut">No pad buttons pressed for ${escHtml(rm.name)} yet.</div>` : roomTaskEvents.map((ev) => `
                <div class="rounded-lg border border-line bg-well px-3 py-2 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="font-semibold text-pri">${escHtml(ev.headline)}</span>
                    <span class="font-mono text-[10px] text-mut">${clockTime(ev.createdAt)}</span>
                  </div>
                  <div class="mt-0.5 text-sec">${escHtml(ev.nurseAction)}</div>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderStaffView() {
      const isAdmin = effectiveRole() === 'admin';
      return `
        <div class="space-y-5">
          <section class="card-12 p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">

                    <th class="px-4 py-2.5">Name</th>
                    <th class="px-4 py-2.5">Email</th>
                    <th class="px-4 py-2.5">Role</th>
                    <th class="px-4 py-2.5 text-right">Tokens</th>
                    <th class="px-4 py-2.5 text-right">Spend</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-line">
                  ${state.staffAccounts.map((s) => {
                    const staffLogs = state.apiLogs.filter((l) => !l.actorName || l.actorName === s.name);
                    const tok = staffLogs.reduce((acc, l) => acc + Number(l.totalTokens || 0), 0);
                    const spend = staffLogs.reduce((acc, l) => {
                      const mk = classifyModelKey(l.model);
                      const pr = state.modelPricing[mk] ?? 0.01;
                      return acc + (Number(l.totalTokens || 0) / 1000) * pr;
                    }, 0);
                    return `
                      <tr>
                        <td class="px-4 py-2.5 font-medium text-pri">${escHtml(s.name)}</td>
                        <td class="px-4 py-2.5 font-mono text-[11px] text-sec">${escHtml(s.email)}</td>
                        <td class="px-4 py-2.5 font-mono text-[10px] uppercase text-sec">${escHtml(s.role.replace('_', ' '))}</td>
                        <td class="px-4 py-2.5 text-right font-mono text-sec">${tok.toLocaleString()}</td>
                        <td class="px-4 py-2.5 text-right font-mono text-pri">$${spend.toFixed(4)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      `;
    }

      if (state.modal === 'confirm' && state.confirmDialog) {
        const c = state.confirmDialog;
        return `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm" data-action="close-modal-backdrop">
            <div role="dialog" aria-modal="true" class="card-12 w-full max-w-md p-5 shadow-2xl" onclick="event.stopPropagation()">

              <div class="mt-4 flex justify-end gap-2">
                <button type="button" data-action="close-modal" class="btn-base btn-secondary">Cancel</button>
                <button type="button" data-action="confirm-dialog-accept" class="btn-base ${c.variant === 'primary' ? 'btn-primary' : 'btn-danger'}">${escHtml(c.confirmLabel || 'Confirm')}</button>

        return `

            <div role="dialog" aria-modal="true" class="card-12 max-h-[90vh] w-full max-w-xl overflow-y-auto p-5 shadow-2xl space-y-4" onclick="event.stopPropagation()">
              <div class="flex items-start justify-between border-b border-line pb-3">

                  <h3 class="text-sm font-semibold text-pri">Meta API Keys &amp; Model Pipeline Checker</h3>

                </div>
                <button type="button" data-action="close-modal" class="btn-base btn-ghost">✕</button>
              </div>

              ${kf.notice ? `
                <div role="alert" class="rounded-lg border ${kf.notice.tone === 'ok' ? 'border-emerald-500/40 bg-emerald-500/10' : 'border-rose-500/40 bg-rose-500/10'} p-3 text-xs">
                  <div class="font-semibold text-pri">${escHtml(kf.notice.title)}</div>
                  <div class="mt-0.5 font-mono text-[11px] text-sec">${escHtml(kf.notice.detail)}</div>
                </div>
              ` : ''}

              <div class="space-y-3">
                <div>
                  <label for="modal-key-baseurl" class="block text-xs font-medium text-pri mb-1">Meta API Base URL</label>
                  <input id="modal-key-baseurl" type="text" class="input-std font-mono text-xs" placeholder="https://api.meta.ai/v1" value="${escHtml(kf.baseUrl || 'https://api.meta.ai/v1')}" />
                </div>
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <label for="modal-key-model" class="text-xs font-medium text-pri">Unified Meta API Key (MODEL_API_KEY)</label>
                    <button type="button" data-action="toggle-keys-show" class="text-[11px] text-sec hover:text-pri">${kf.show ? 'Hide' : 'Show'}</button>
                  </div>
                  <input id="modal-key-model" type="${kf.show ? 'text' : 'password'}" class="input-std font-mono text-xs" placeholder="Paste your Meta MODEL_API_KEY…" value="${escHtml(kf.model || state.sessionKeys.model)}" />
                </div>

                <button type="button" data-action="toggle-keys-advanced" class="text-xs text-sec hover:text-pri">
                  ${kf.advanced ? 'Hide override keys' : 'Optional override keys (SAM 3.1, Spark 1.3, Voice 1.0, Wonder 1.0)'}

                ${kf.advanced ? `
                  <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">

                    <input id="modal-key-spark" type="${kf.show ? 'text' : 'password'}" class="input-std font-mono text-xs" placeholder="SPARK_API_KEY" value="${escHtml(kf.spark)}" />
                    <input id="modal-key-voice" type="${kf.show ? 'text' : 'password'}" class="input-std font-mono text-xs" placeholder="VOICE_API_KEY" value="${escHtml(kf.voice)}" />

                        { id: 'sam-3.1', ep: 'POST /v1/responses', k: 'sam', ok: state.api.samVerified, lat: state.api.samLatencyMs },
                        { id: 'muse-wonder-1.0', ep: 'POST /v1/responses', k: 'wonder', ok: isLive || state.api.wonderVerified, lat: state.api.wonderLatencyMs },

                </button>

      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.screen === 'home') {
        root.innerHTML = renderHomePage();
        attachEvents();
        renderToasts();
        initHomeInteractions();
        return;
      }

      if (state.screen === 'login' || !state.authenticated) {
        root.innerHTML = renderLoginPage();
        attachEvents();
        renderToasts();
        return;
      }

      const role = effectiveRole();
      const isAdmin = role === 'admin';
      const activeEscCount = state.escalations.filter((e) => e.active).length;

        { id: 'dashboard', label: 'Ward Dashboard', short: 'Work', group: 'Triage & Clinical', icon: IC.home },

        { id: 'vision', label: 'Vision Tracking', short: 'Vision', group: 'Triage & Clinical', icon: IC.video },
        { id: 'voice', label: 'Bedside Voice', short: 'Voice', group: 'Triage & Clinical', icon: IC.mic },
        { id: 'pads', label: 'Bedside Pads', short: 'Pads', group: 'Triage & Clinical', icon: IC.tablet },
        { id: 'usage', label: 'Usage & Costs', short: 'Usage', group: 'Operations', icon: IC.chart },
        { id: 'calendar', label: 'Activity Calendar', short: 'Calendar', group: 'Operations', icon: IC.calendar },
        { id: 'staff', label: 'Staff', short: 'Staff', group: 'Operations', icon: IC.users }
      ];

      root.innerHTML = `
        <div class="flex min-h-screen bg-ink text-pri">

              <button type="button" data-action="go-home" title="ULEBI Home Screen" aria-label="ULEBI Home Screen" class="flex h-8 w-8 items-center justify-center rounded-lg border border-line-strong bg-raised text-pri">
                ${IC.logo}
              </button>
              ${navItems.slice(0, 6).map((item) => `
                <button type="button" data-action="nav-page" data-page="${item.id}" title="${item.label}" aria-label="${item.label}" class="flex flex-col items-center gap-0.5">

                    ${item.icon}
                  </span>
                  <span class="text-[9px] ${state.activePage === item.id ? 'text-pri font-medium' : 'text-mut'}">${item.short}</span>
                </button>
              `).join('')}

            <div class="flex flex-col items-center gap-2.5">
              <button type="button" data-action="open-modal" data-modal="help" title="Help" aria-label="Help" class="flex h-8 w-8 items-center justify-center rounded-lg text-mut hover:text-pri">${IC.help}</button>
              <button type="button" data-action="open-modal" data-modal="accountSettings" title="Profile & Settings" aria-label="Profile" class="flex h-7 w-7 items-center justify-center rounded-full border border-line-strong bg-raised text-[11px] font-medium text-pri">${escHtml((state.me.name || 'S').slice(0, 1).toUpperCase())}</button>
            </div>

                <div class="flex items-center justify-between px-2">

    function saveRoomFromModal() {
      const nameEl = document.getElementById('modal-room-name');
      const ctxEl = document.getElementById('modal-room-ctx');
      const camEl = document.getElementById('modal-room-cam');
      const tokEl = document.getElementById('modal-room-token');

      const name = (nameEl ? nameEl.value : state.roomForm.name).trim();
      const ctx = (ctxEl ? ctxEl.value : state.roomForm.clinicalContext).trim() || 'General care · Standard monitoring';
      const camUrl = (camEl ? camEl.value : state.roomForm.camUrl).trim();

      if (!name) {
        pushToast('err', 'Please enter a Room Name (e.g. Room 204)');
        if (nameEl) nameEl.focus();
        return;
      }

      if (state.editingRoomId) {
        const rm = state.rooms.find((r) => r.id === state.editingRoomId);
        if (rm) {
          rm.name = name;
          rm.clinicalContext = ctx;
          rm.camUrl = camUrl;
          if (state.roomForm.videoFileName) rm.videoFileName = state.roomForm.videoFileName;
          if (state.roomForm.videoBlobUrl) {
            rm.videoBlobUrl = state.roomForm.videoBlobUrl;
            roomVideoBlobs[rm.id] = state.roomForm.videoBlobUrl;
          }
        }
      } else {
        const newId = 'rm-' + Date.now();
        if (state.roomForm.videoBlobUrl) {
          roomVideoBlobs[newId] = state.roomForm.videoBlobUrl;
        }
        state.rooms.push({
          id: newId,
          name,
          clinicalContext: ctx,
          camUrl,
          hasCamToken: Boolean(tokEl?.value),
          videoFileName: state.roomForm.videoFileName || '',
          videoBlobUrl: state.roomForm.videoBlobUrl || '',
          negativeExclusions: 'medical staff, nurse, doctor, visitor',
          bedZone: { xMin: 0.18, yMin: 0.18, xMax: 0.82, yMax: 0.86 },
          clearedAt: null,
          padKey: 'pk_' + Math.random().toString(36).slice(2, 10),
          latestBySource: {}
        });
        state.activeModuleRoomId = newId;
      }
      recordAudit(state.editingRoomId ? 'EDIT_ROOM' : 'ADD_ROOM', name, ctx);
      pushToast('ok', `Saved ${name}`, state.roomForm.videoFileName ? `Attached video: ${state.roomForm.videoFileName}` : ctx);
      state.modal = null;
      persistState();
      render();
    }

    function attachEvents() {
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.onsubmit = (ev) => {
          ev.preventDefault();
          if (state.lockoutSeconds > 0) return;
          const emailEl = document.getElementById('login-email');
          const passEl = document.getElementById('login-password');
          const remEl = document.getElementById('login-remember');
          if (emailEl) state.loginForm.email = emailEl.value.trim().toLowerCase();
          if (passEl) state.loginForm.password = passEl.value;
          if (remEl) state.loginForm.remember = Boolean(remEl.checked);

          state.loginErrors = {};
          state.loginBanner = '';

          if (!state.loginForm.email) {
            state.loginErrors.email = 'Enter your @ulebi.com work email.';
          } else if (!ULEBI_EMAIL_RE.test(state.loginForm.email)) {
            state.loginErrors.email = 'Access is restricted to @ulebi.com email addresses (e.g. sara@ulebi.com).';
          }
          if (state.loginForm.password.length < 8) {
            state.loginErrors.password = 'Password must be at least 8 characters.';
          }
          if (Object.keys(state.loginErrors).length > 0) {
            render();
            return;
          }

          const localPart = state.loginForm.email.split('@')[0] || 'Staff';
          const displayName = localPart
            .split(/[._-]+/)
            .filter(Boolean)
            .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ');
          state.me = {
            id: 'u-' + localPart,
            name: displayName || state.loginForm.email,
            email: state.loginForm.email,
            role: 'admin'
          };
          if (!state.staffAccounts.some((s) => s.email.toLowerCase() === state.loginForm.email)) {
            state.staffAccounts.push({ ...state.me });
          }
          state.authenticated = true;
          state.screen = 'dashboard';
          recordAudit('SIGN_IN', 'Ward Workstation', `Signed in with ${state.loginForm.email}`);
          pushToast('ok', `Signed in as ${state.me.name}`, state.me.email);
          persistState();
          render();
        };
      }

      const roomModalForm = document.getElementById('room-modal-form');
      if (roomModalForm) {
        roomModalForm.onsubmit = (ev) => {
          ev.preventDefault();
          saveRoomFromModal();
        };
      }
      const rmNameInp = document.getElementById('modal-room-name');
      if (rmNameInp) rmNameInp.oninput = (e) => { state.roomForm.name = e.target.value; };
      const rmCtxInp = document.getElementById('modal-room-ctx');
      if (rmCtxInp) rmCtxInp.oninput = (e) => { state.roomForm.clinicalContext = e.target.value; };
      const rmCamInp = document.getElementById('modal-room-cam');
      if (rmCamInp) rmCamInp.oninput = (e) => { state.roomForm.camUrl = e.target.value; };
      const rmTokInp = document.getElementById('modal-room-token');
      if (rmTokInp) rmTokInp.oninput = (e) => { state.roomForm.camToken = e.target.value; };

      const rmVideoInp = document.getElementById('modal-room-video-file');
      if (rmVideoInp) {
        rmVideoInp.onchange = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          state.roomForm.videoFileName = file.name;
          state.roomForm.videoBlobUrl = url;
          pushToast('ok', `Attached ${file.name}`);
          render();
        };
      }

      const visionFileInp = document.getElementById('vision-video-file-input');
      if (visionFileInp) {
        visionFileInp.onchange = (e) => {
          const file = e.target.files?.[0];
          const rm = state.rooms.find((r) => r.id === state.activeModuleRoomId) || state.rooms[0];
          if (!file || !rm) return;
          const url = URL.createObjectURL(file);
          rm.videoFileName = file.name;
          rm.videoBlobUrl = url;
          roomVideoBlobs[rm.id] = url;
          recordAudit('UPLOAD_TEST_VIDEO', rm.name, `Loaded video: ${file.name}`);
          pushToast('ok', `Loaded ${file.name} into ${rm.name}`);
          persistState();
          render();
        };
      }

      const voiceFileInp = document.getElementById('voice-video-file-input');
      if (voiceFileInp) {
        voiceFileInp.onchange = (e) => {
          const file = e.target.files?.[0];
          e.target.value = '';
          if (file) extractAndTranscribeFileAudio(file);
        };
      }
      const keyBaseInp = document.getElementById('modal-key-baseurl');
      if (keyBaseInp) {
        keyBaseInp.oninput = (e) => {
          state.keysForm.baseUrl = e.target.value.trim();
          safeSetStorage('ulebi_meta_base', state.keysForm.baseUrl);
        };
      }

      const keyModelInp = document.getElementById('modal-key-model');
      if (keyModelInp) keyModelInp.oninput = (e) => { state.keysForm.model = e.target.value; };
      const keySamInp = document.getElementById('modal-key-sam');
      if (keySamInp) keySamInp.oninput = (e) => { state.keysForm.sam = e.target.value; };
      const keySparkInp = document.getElementById('modal-key-spark');
      if (keySparkInp) keySparkInp.oninput = (e) => { state.keysForm.spark = e.target.value; };
      const keyVoiceInp = document.getElementById('modal-key-voice');
      if (keyVoiceInp) keyVoiceInp.oninput = (e) => { state.keysForm.voice = e.target.value; };
      const keyWonderInp = document.getElementById('modal-key-wonder');
      if (keyWonderInp) keyWonderInp.oninput = (e) => { state.keysForm.wonder = e.target.value; };

      const addNurseForm = document.getElementById('add-nurse-form');
      if (addNurseForm) {
        addNurseForm.onsubmit = (ev) => {
          ev.preventDefault();
          const name = document.getElementById('new-nurse-name')?.value.trim() || '';
          const role = document.getElementById('new-nurse-role')?.value.trim() || 'Ward RN';
          if (!name) {
            pushToast('err', 'Enter a nurse name first');
            return;
          }
          state.nurses.push({ id: 'n-' + Date.now(), name, role, onDuty: true, callOrder: state.nurses.length + 1 });
          recordAudit('ADD_ROSTER_NURSE', name, `Added ${name} to Shift Roster`);
          pushToast('ok', `Added ${name} to roster`);
          persistState();
          render();
        };
      }

      const assistantForm = document.getElementById('assistant-form');
      if (assistantForm) {
        assistantForm.onsubmit = (ev) => {
          ev.preventDefault();
          const inp = document.getElementById('assistant-input');
          const q = inp ? inp.value.trim() : '';
          if (!q) return;
          handleAssistantQuery(q);
        };
      }

      const triageSearch = document.getElementById('triage-search-input');
      if (triageSearch) {
        triageSearch.oninput = (e) => {
          state.triageSearch = e.target.value;
          render();
          const el = document.getElementById('triage-search-input');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        };
      }
      const triageAdv = document.getElementById('triage-adv-filter');
      if (triageAdv) triageAdv.onchange = (e) => { state.triageAdvFilter = e.target.value; render(); };

      const stepTimeoutSel = document.getElementById('step-timeout-select');
      if (stepTimeoutSel) {
        stepTimeoutSel.onchange = (e) => {
          state.escalationTimeoutSec = Number(e.target.value);
          pushToast('ok', `Step timeout set to ${state.escalationTimeoutSec}s`);
          persistState();
          render();
        };
      }

      const scrubber = document.getElementById('timeline-scrubber');
      if (scrubber) scrubber.oninput = (e) => { state.scrubberSec = Number(e.target.value); render(); };

      const speedSel = document.getElementById('timeline-speed-select');
      if (speedSel) speedSel.onchange = (e) => { state.timelineSpeed = Number(e.target.value); render(); };

      const calSearch = document.getElementById('cal-search-input');
      if (calSearch) {
        calSearch.oninput = (e) => {
          state.calSearch = e.target.value;
          render();
          const el = document.getElementById('cal-search-input');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        };
      }

      const cmdSearchInp = document.getElementById('cmd-search-input');
      if (cmdSearchInp) {
        cmdSearchInp.oninput = (e) => {
          state.cmdSearch = e.target.value;
          render();
          const el = document.getElementById('cmd-search-input');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        };
      }

      const voiceInput = document.getElementById('voice-transcript-input');
      if (voiceInput) voiceInput.oninput = (e) => { state.voiceTranscript = e.target.value; };
      const voiceLangSel = document.getElementById('voice-lang-select');
      if (voiceLangSel) voiceLangSel.onchange = (e) => { state.voiceLang = e.target.value; };
      document.querySelectorAll('[data-action="change-staff-role"]').forEach((sel) => {
        sel.onchange = (e) => {
          const stf = state.staffAccounts.find((x) => x.id === sel.getAttribute('data-staff'));
          if (stf) {
            stf.role = e.target.value;
            pushToast('ok', `Updated ${stf.name} role to ${stf.role}`);
            persistState();
            render();
          }
        };
      });
      const padNoteInput = document.getElementById('pad-note-input');
      if (padNoteInput) padNoteInput.oninput = (e) => { state.padNote = e.target.value; };
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');

      if (action === 'home-scroll') {
        const targetId = btn.getAttribute('data-target') || '';
        state.homeActiveSection = targetId;

          pushToast('err', 'Staff email must be an @ulebi.com address');
          return;
        }
        state.staffAccounts.push({ id: 'u-' + Date.now(), name, email, role });
        persistState();
        render();
      } else if (action === 'remove-staff-account') {
        const id = btn.getAttribute('data-staff');
        state.staffAccounts = state.staffAccounts.filter((x) => x.id !== id);
        persistState();
        render();
      } else if (action === 'toggle-profile-dropdown') {
        state.profileDropdownOpen = !state.profileDropdownOpen;
        render();
      } else if (action === 'switch-role') {
        state.roleOverride = btn.getAttribute('data-role');
        state.profileDropdownOpen = false;
        render();
      } else if (action === 'toggle-assistant') {
        state.assistantOpen = !state.assistantOpen;
        render();
      }
    });

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (state.authenticated && state.screen === 'dashboard') {
          state.modal = state.modal === 'cmd' ? null : 'cmd';
          render();
        }
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        if (state.authenticated && state.screen === 'dashboard') {
          state.sidebarExpanded = !state.sidebarExpanded;
          render();
        }
      } else if (e.key === 'Escape' && state.modal) {
        state.modal = null;
        render();
      }
    });

    window.addEventListener('scroll', () => {
      const topbar = document.getElementById('main-topbar');
      const prog = document.getElementById('scroll-progress-bar');
      const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      if (topbar) {
        if (scrollY > 12) topbar.classList.add('header-scrolled');
        else topbar.classList.remove('header-scrolled');
      }
      if (prog) {
        const pct = Math.min(100, Math.max(0, (scrollY / maxScroll) * 100));
        prog.style.width = (scrollY > 2 ? Math.max(8, pct) : 0) + '%';
      }
    }, { passive: true });

    window.__ulebiOpenLoginFromHome = () => {
      state.screen = 'login';
      state.loginErrors = {};
      state.loginBanner = '';
      render();
    };

    window.addEventListener('message', (ev) => {
      if (ev?.data && ev.data.type === 'ULEBI_GO_LOGIN') {
        window.__ulebiOpenLoginFromHome();
      }
    });

    window.onload = () => {
      render();
    };
  </script>
</body>
</html>
